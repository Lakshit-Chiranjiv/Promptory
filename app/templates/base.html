<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Promptory — LLM Prompt Version Control{% endblock %}</title>
  <meta name="description" content="Self-hosted Git-like prompt version control and test-run manager for LLM engineering.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>

<nav>
  <div class="inner">
    <a href="/" class="brand">
      <div class="brand-icon-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
      </div>
      <span class="brand-title">Promptory</span>
      <span class="brand-tag">v1.0</span>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link">Prompts</a>
      <a href="/docs" class="nav-link-api" target="_blank" rel="noopener noreferrer">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Swagger API
      </a>
    </div>
  </div>
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>

<script>
  function copyText(button, text) {
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const original = button.innerHTML;
      button.innerHTML = '✓ Copied!';
      button.style.borderColor = 'var(--emerald)';
      button.style.color = 'var(--emerald)';
      setTimeout(() => {
        button.innerHTML = original;
        button.style.borderColor = '';
        button.style.color = '';
      }, 1800);
    }).catch(err => {
      console.error('Failed to copy text: ', err);
    });
  }
</script>

</body>
</html>
